<script>
(function() {
  var storageKey = 'mdweb-color-scheme';
  var match = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var choice = 'system';
  try {
    var saved = localStorage.getItem(storageKey);
    if (saved) choice = saved;
  } catch (error) {
    choice = 'system';
  }
  var actual = choice === 'system' ? (match && match.matches ? 'dark' : 'light') : choice;
  document.documentElement.dataset.themeChoice = choice;
  document.documentElement.dataset.theme = actual;
})();
</script>

<script>
  // 处理锚点点击 防止被header遮住
  document.addEventListener('DOMContentLoaded', function () {
    // 获取header高度
    const header = document.querySelector('.site-header');
    const headerHeight = header ? header.offsetHeight + 20 : 100; // 添加20px额外间距

    // 监听所有锚点链接的点击事件
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();

        const targetId = this.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);

        if (targetElement) {
          // 计算目标位置需要考虑header高度
          const targetPosition = targetElement.offsetTop - headerHeight;

          // 平滑滚动到目标位置
          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });
        }
      });
    });

    // 处理页面加载时的hash锚点
    if (window.location.hash) {
      const targetId = window.location.hash.substring(1);
      const targetElement = document.getElementById(targetId);

      if (targetElement) {
        // 延迟执行，确保页面完全加载
        setTimeout(() => {
          const targetPosition = targetElement.offsetTop - headerHeight;
          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });
        }, 100);
      }
    }
  });
</script>
