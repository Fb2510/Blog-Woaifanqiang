<script>
(function() {
  var storageKey = 'mdweb-color-scheme';
  var match = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var choice = 'system';
  try {
    var saved = localStorage.getItem(storageKey);
    if (saved) choice = saved;
  } catch (error) {
    choice = 'system';
  }
  var actual = choice === 'system' ? (match && match.matches ? 'dark' : 'light') : choice;
  document.documentElement.dataset.themeChoice = choice;
  document.documentElement.dataset.theme = actual;
})();
</script>
